name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS dependencies
        run: |
          rm -rf node_modules
          npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Point Gradle at the preinstalled SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: |
          mkdir -p artifacts
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uust-journal-android-apk
          path: artifacts/*.apk
          retention-days: 30
