name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
        # Cache Gradle so repeat builds are fast.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JS dependencies
        run: |
          rm -rf node_modules
          npm install --no-audit --no-fund
      - name: Fix executable bits
        run: find node_modules -type f \( -name "*.sh" -o -path "*/.bin/*" \) -exec chmod +x {} + || true
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uust-journal-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
