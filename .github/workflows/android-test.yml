      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure separate test application
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const a = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          a.expo.name = 'uust-app Test';
          a.expo.android.package = 'com.exile37.uustjournal.test';
          fs.writeFileSync('app.json', JSON.stringify(a, null, 2));
          NODE
          CI=1 npx expo prebuild --platform android --no-install --clean
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Build standalone test APK with generated debug signature
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Verify signature and metadata
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/uust-journal-1.3.0-test-arm64.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uust-journal-test-apk
          path: artifacts/
          retention-days: 14
