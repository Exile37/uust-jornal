           ├── eas.json                            # Профили EAS-сборки
           ├── package.json
           ├── proxy.py                            # Локальный Flask-прокси к сайту журнала (см. ниже)
          +├── recordbook_parser.py                # Точный разбор официальной зачётки
           ├── assets/                             # Иконка, splash, favicon
           ├── plugins/
           │   └── withNoApsEnvironment.js         # Убирает push-entitlement (нужно для бесплатной подписи)
          @@ -145,8 +146,9 @@ export const PROXY_URL = 'https://uust-proxy.onrender.com';
           
           - `GET /api/recordbook` — разбирает ведомость на семестры, дисциплины, формы контроля, преподавателей, даты и оценки, считает средний балл, зачётные единицы и долги;
           - `GET /api/debug/statement` — показывает, что реально пришло со страницы (заголовки таблиц, первые строки, текст). Нужен, если в ЛК поменяется вёрстка.
          +- `recordbook_parser.py` — парсер семестров и полей таблицы; `python -m unittest discover -s tests -v` запускает проверки на фикстуре.
           
          -Если прокси ещё не обновлён или страница не разобралась, приложение собирает книжку из журнала (`/api/subjects` + `/api/grades`) и помечает данные как «собрано из журнала». Это резервный режим: итоговые оценки в нём могут отличаться от личного кабинета.
          +Зачётка показывает только официальную выписку, не подменяя её оценками из журнала. Приложение принимает ответ версии схемы 2; если сервер ещё не обновлён или страницу не удалось разобрать, показывается ошибка (либо кэш именно официальной выписки этой версии), а не неверная «зачётка» из текущих оценок.
           
