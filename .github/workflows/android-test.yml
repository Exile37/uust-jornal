name: Test APK - recordbook and speed
on:
  push:
    branches: [test/apk-20261104]
    paths: ['.github/workflows/android-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src
            tests
          fetch-depth: 1
      - name: Apply reviewed test changes (main is unchanged)
        shell: bash
        run: |
          cat > /tmp/test-changes.patch <<'REVIEWED_PATCH'
